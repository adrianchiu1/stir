# Weekly dry run of the reference-data updaters. GitHub runners have internet,
# so this catches a site redesign or a newly published calendar early. It never
# commits: a non-zero exit opens the job as failed and AC runs --commit locally.
name: refdata-dry-run
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: python scripts/update_refdata.py --bank fed --bank ecb --bank boe --bank boj --ecb-maintenance --policy-rates fed --policy-rates ecb --policy-rates boe --holidays uk jp us_sifma --dry-run
