[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stircurve"
version = "0.0.1"
description = "Meeting-date aware STIR / OIS curve construction for central-bank policy pricing (Fed, ECB, BoE, BoJ)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6",
    "requests>=2.28",
    "lxml>=4.9",
    "openpyxl>=3.1",   # BoE MPC voting-history workbook (refdata updater)
]

[project.optional-dependencies]
quantlib = ["QuantLib>=1.31"]
plot = ["plotly>=5", "pxts[plot] @ git+https://github.com/adrianchiu1/pxts"]
bloomberg = ["pxts[bloomberg] @ git+https://github.com/adrianchiu1/pxts"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["stircurve*"]

[tool.setuptools.package-data]
stircurve = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
